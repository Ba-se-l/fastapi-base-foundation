[project]
name = "fastapi-base-structure"
version = "1.0.0"
description = "Hardened enterprise FastAPI base foundation"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "pydantic[email]>=2.13.4",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.0.52",
    "uvicorn>=0.52.4",
    "pyjwt>=2.13.0",
    "pwdlib[argon2]>=0.3.1",
    "casbin>=1.43.0",
    "casbin-async-sqlalchemy-adapter>=1.17.0",
]

[tool.pyright]
extraPaths = ["."]
venvPath = "."
venv = ".venv"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-multipart>=0.0.32",
    "httpx>=0.28.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
addopts = ["--strict-markers", "-ra", "-p", "no:anyio"]
markers = [
    "release_gate: RG-01..RG-15 enterprise release-gate contracts",
    "security_audit: SEC-01..SEC-18 V1 security-audit regressions",
]
